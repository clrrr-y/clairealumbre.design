    .photo-page .photo-gallery { width: min(1200px, calc(100% - 96px)); margin: 0 auto; padding-bottom: 120px; }

    .photo-page .photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; grid-auto-rows: auto; gap: 20px; }
    .photo-page .photo-grid .work-item { min-height: 0; aspect-ratio: auto !important; }
    .photo-page .photo-grid .work-item img { display: block; width: 100%; height: auto !important; object-fit: contain; }
    .photo-page .photo-grid--events .work-item { aspect-ratio: 403.4 / 227 !important; }
    .photo-page .photo-grid--events .work-item img { width: 100%; height: 100% !important; object-fit: cover; }
    .photo-page .photo-grid--events .event-crop--top img { height: 118.58% !important; object-position: top; }
    .photo-page .photo-grid--events .event-crop--zoom img { width: 115.14%; height: 136.56% !important; max-width: none; transform: translate(-7.22%, -28.55%); }
    @media (max-width: 760px) {
