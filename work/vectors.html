  <style>
    .vector-page .work-header { width: min(1200px, calc(100% - 96px)); margin-inline: auto; padding: 150px 0 0; text-align: left; }

    .vector-page .vector-intro { width: min(1200px, calc(100% - 96px)); margin: 0 auto; padding: 18px 0 34px; }
    .vector-page .vector-intro p { max-width: 780px; margin: 0; color: var(--ink-soft); font-size: 18px; line-height: 1.65; }
    .vector-page .vector-intro__link { margin-top: 28px !important; }
    .vector-page .vector-intro__link a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .vector-page .vector-gallery { width: min(1200px, calc(100% - 96px)); margin: 0 auto; padding-bottom: 120px; }
    .vector-page .vector-category { margin-top: 54px; }
    .vector-page .vector-category:first-child { margin-top: 0; }

    .vector-page .vector-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; grid-auto-rows: auto; gap: 32px 24px; }
    .vector-page .vector-grid .work-item { min-height: 0; aspect-ratio: auto !important; position: relative; transform: translateZ(0); transition: transform 320ms cubic-bezier(.2, 1.55, .45, 1), box-shadow 320ms cubic-bezier(.22, 1, .36, 1); will-change: transform; }
    .vector-page .vector-grid .work-item img { display: block; width: 100%; height: auto !important; object-fit: contain; }
    .vector-page .vector-grid--family { grid-template-columns: repeat(3, minmax(0, 349.289px)); row-gap: 36px; column-gap: 26.066px; }
    .vector-page .vector-grid--family .work-item { aspect-ratio: 1 !important; border-radius: 9.201px; box-shadow: 0 4.603px 4.603px rgba(0, 0, 0, .25); }
    .vector-page .vector-grid--family .work-item img { width: 100%; height: 100% !important; object-fit: cover; }
    .vector-page .vector-grid--family .family-crop--nathalie img { width: 133.46%; max-width: none; transform: translateX(-16.73%); }
    .vector-page .vector-grid--family .family-crop--limchoc img { height: 150.11% !important; transform: translateY(-36.01%); }
    .vector-page .vector-grid--pets { grid-template-columns: repeat(3, minmax(0, 349.388px)); row-gap: 36px; column-gap: 26.074px; }
    .vector-page .vector-grid--pets .work-item { aspect-ratio: 1 !important; border-radius: 9.204px; box-shadow: 0 4.604px 4.604px rgba(0, 0, 0, .25); }
    .vector-page .vector-grid--pets .work-item img { width: 100%; height: 100% !important; object-fit: cover; }
    .vector-page .vector-grid--pets .pets-silhouette { display: flex; align-items: flex-start; justify-content: center; background: #926d64; }
    .vector-page .vector-grid--pets .pets-silhouette img { width: 258.999px; height: 335.482px !important; object-fit: contain; }
    .vector-page .vector-grid--pets .pets-teves img { width: 104.24%; max-width: none; transform: translateX(-4.24%); }
    .vector-page .vector-grid--pets .pets-composite { position: relative; overflow: hidden; background: #edc482; }
    .vector-page .vector-grid--pets .pets-composite::before { position: absolute; inset: 0; background: #edc482; content: ''; }
    .vector-page .vector-grid--pets .pets-composite img { position: absolute; top: -11.05%; left: 60.84px; width: 288.62px; height: 111.05% !important; object-fit: fill; }
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .vector-page .vector-grid .work-item:hover,
      .vector-page .vector-grid .work-item:focus-within { z-index: 5; transform: translateY(-10px) scale(1.05); box-shadow: 0 22px 42px rgba(0, 0, 0, .2); }
    }
    .vector-page .vector-grid .work-item--pad { min-height: 220px; }
    .vector-page .vector-grid .work-item--pad img { width: auto; max-width: 80%; height: auto !important; max-height: 80%; object-fit: contain; }
    @media (max-width: 760px) {
      .vector-page .work-header { width: min(100% - 40px, 600px); padding-top: 118px; }
      .vector-page .vector-intro { width: min(100% - 40px, 600px); padding: 16px 0 24px; }
      .vector-page .vector-intro p { font-size: 16px; }
      .vector-page .vector-gallery { width: min(100% - 40px, 600px); }
      .vector-page .vector-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
      .vector-page .vector-grid--family,
      .vector-page .vector-grid--pets { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
      .vector-page .vector-grid--pets .pets-silhouette img { width: 74%; height: auto !important; }
      .vector-page .vector-grid--pets .pets-composite img { top: 1%; left: 21%; width: 58%; height: 98% !important; }
    }
    @media (max-width: 460px) { .vector-page .vector-grid { grid-template-columns: 1fr; } }
